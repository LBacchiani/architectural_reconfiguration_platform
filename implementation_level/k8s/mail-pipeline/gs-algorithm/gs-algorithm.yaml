apiVersion: apps/v1
kind: Deployment
metadata:
  name: gs-algorithm
spec:
  selector:
    matchLabels:
      app: gs-algorithm
  template:
    metadata:
      labels:
        app: gs-algorithm
    spec:
      serviceAccountName: scaler-service-account
      containers:
        - name: gs-algorithm
          image: lorenzobacchiani/mail_pipeline_gs
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: INCLUSTER_CONFIG
              value: "true"
            - name: K_BIG
              value: "10"
            - name:  SLEEP
              value: "10"
            - name: K
              value: "5"
            - name: ERROR_LIMIT
              value: "3"
            - name: PROACTIVE
              value: "false"
            - name: PROACTIVE_REACTIVE
              value: "false"
            - name: PROMETHEUS_SERVICE_ADDRESS
              value: "prometheus-service.monitoring.svc.cluster.local"
            - name: PROMETHEUS_SERVICE_PORT
              value: "8080"
            - name: MONITOR_ONLY
              value: "false"
            - name: FOLDER_PATH
              value: "/app/my_files"
            - name: SYSTEM_BASE_CONFIGURATION
              value: 1,1,1,1,1,1,1,1 
            - name: MICROSERVICES_MCL
              value: 110,1000000000,1000000000,1000000000,120,231,231,300
            - name: MICROSERVICES_MF
              value: 1,1,1,1,2,1.5,1.5,5
            - name: INCREMENT_1
              value: "1,0,0,0,1,0,0,1"
            - name: INCREMENT_2
              value: "1,0,0,0,3,1,1,3"
            - name: INCREMENT_3
              value: "2,0,0,0,4,1,1,4"
            - name: INCREMENT_4
              value: "3,0,0,0,6,2,2,6"
            - name: HTTP_REQUESTS_METRIC
              value: "http_requests_total_parser_counter"
            - name: BEHAVIOUR_EXECUTION_METRIC
              value: "http_requests_total_global"
            - name: BEHAVIOUR_TIME_METRIC
              value: "http_requests_total_time"
            - name: MESSAGE_LOST_METRIC
              value: "message_lost_global_counter"
            - name: ADDITIONAL_SERVICE
              value: "3"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: gs-algorithm-service
spec:
  selector:
    app: gs-algorithm
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: pod-creator
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["create", "get", "list", "delete", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-creator-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: scaler-service-account
roleRef:
  kind: Role
  name: pod-creator
  apiGroup: rbac.authorization.k8s.io