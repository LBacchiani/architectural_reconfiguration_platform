apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommender
spec:
  selector:
    matchLabels:
      type: recommender-type
  template:
    metadata:
      labels:
        type: recommender-type
    spec:
      containers:
        - name: recommender
          image: giovaz94/tea-store-general 
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: MCL
              value: "5000"
            - name: SERVICE_NAME
              value: "recommender"
            - name: PORT
              value: "80"
            - name: MAX_SIZE
              value: "1000"
            - name: OUTPUT_SERVICES
              value: '{}'
            
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: recommender-service
  labels:
    type: recommender-service-type
  annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "80"
      prometheus.io/path: "/metrics"   # optional, defaults to /metrics
spec:
  selector:
    type: recommender-type
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

