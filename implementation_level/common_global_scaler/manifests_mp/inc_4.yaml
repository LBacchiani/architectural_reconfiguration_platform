                  memory: 10M
              env:
              - name: MCL
                value: '300'
              - name: REDIS_HOST
                value: redis-service
              - name: SERVICE_NAME
                value: message-analyzer
              - name: PORT
                value: '80'
              - name: MAX_SIZE
                value: '800'
              - name: MAX_CONNECTIONS
                value: '70'
              - name: PIPELINE_COUNT
                value: '1'
