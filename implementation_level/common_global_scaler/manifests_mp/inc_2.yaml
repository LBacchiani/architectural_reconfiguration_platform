name: my-k8s-app
runtime: yaml
resources:
  message-analyzer-2767dc9b-aad0-4210-83e2-8924672c20a7:
    name: message-analyzer-2767dc9b-aad0-4210-83e2-8924672c20a7
    type: kubernetes:apps/v1:Deployment
    properties:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: message-analyzer-2767dc9b-aad0-4210-83e2-8924672c20a7
        labels:
          type: message-analyzer-type
      spec:
        replicas: 2
        selector:
          matchLabels:
            type: message-analyzer-type
        template:
          metadata:
            labels:
              type: message-analyzer-type
          spec:
            containers:
            - name: message-analyzer
              image: giovaz94/mail-pipeline-general
              imagePullPolicy: IfNotPresent
              ports:
              - containerPort: 80
              resources:
                requests:
                  cpu: 10m
                  memory: 10M
              env:
              - name: MCL
                value: '300'
              - name: REDIS_HOST
                value: redis-service
              - name: SERVICE_NAME
                value: message-analyzer
              - name: PORT
                value: '80'
              - name: MAX_SIZE
                value: '800'
              - name: MAX_CONNECTIONS
                value: '70'
              - name: PIPELINE_COUNT
                value: '1'
    options: {}
