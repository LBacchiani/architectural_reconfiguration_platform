name: my-k8s-app
runtime: yaml
resources:
  message-analyzer-273cf132-5497-4677-89c0-11af00d321a7:
    name: message-analyzer-273cf132-5497-4677-89c0-11af00d321a7
    type: kubernetes:apps/v1:Deployment
    properties:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: message-analyzer-273cf132-5497-4677-89c0-11af00d321a7
        labels:
          type: message-analyzer-type
      spec:
        replicas: 1
        selector:
          matchLabels:
            type: message-analyzer-type
        template:
          metadata:
            labels:
              type: message-analyzer-type
          spec:
            containers:
            - name: message-analyzer
              image: giovaz94/mail-pipeline-general
              imagePullPolicy: IfNotPresent
              ports:
              - containerPort: 80
              resources:
                requests:
                  cpu: 10m
                  memory: 10M
              env:
              - name: MCL
                value: '300'
              - name: REDIS_HOST
                value: redis-service
              - name: SERVICE_NAME
                value: message-analyzer
              - name: PORT
                value: '80'
              - name: MAX_SIZE
                value: '800'
              - name: MAX_CONNECTIONS
                value: '70'
              - name: PIPELINE_COUNT
                value: '1'
    options: {}
  virus-scanner-a782700b-fd88-4021-9834-b574d24a5a42:
    name: virus-scanner-a782700b-fd88-4021-9834-b574d24a5a42
    type: kubernetes:apps/v1:Deployment
    properties:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: virus-scanner-a782700b-fd88-4021-9834-b574d24a5a42
        labels:
          type: virus-scanner-type
      spec:
        replicas: 1
        selector:
          matchLabels:
            type: virus-scanner-type
        template:
          metadata:
            labels:
              type: virus-scanner-type
          spec:
            containers:
            - name: virus-scanner
              image: giovaz94/mail-pipeline-general
              imagePullPolicy: IfNotPresent
              ports:
              - containerPort: 80
              resources:
                requests:
                  cpu: 10m
                  memory: 10M
              env:
              - name: MCL
                value: '120'
              - name: REDIS_HOST
                value: redis-service
              - name: SERVICE_NAME
                value: virus-scanner
              - name: PORT
                value: '80'
              - name: MAX_SIZE
                value: '800'
              - name: MAX_CONNECTIONS
                value: '70'
              - name: PIPELINE_COUNT
                value: '1'
              - name: PORT_MESSAGE_ANALYZER_SERVICE
                type: message-analyzer-service-type
              - name: PORT_ATTACHMENT_MANAGER_SERVICE
                type: attachment-manager-service-type
    options: {}
  parser-9d1d2f84-cba8-427b-9afe-f464694250c6:
    name: parser-9d1d2f84-cba8-427b-9afe-f464694250c6
    type: kubernetes:apps/v1:Deployment
    properties:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: parser-9d1d2f84-cba8-427b-9afe-f464694250c6
        labels:
          type: parser-type
      spec:
        replicas: 1
        selector:
          matchLabels:
            type: parser-type
        template:
          metadata:
            labels:
              type: parser-type
          spec:
            containers:
            - name: parser
              image: giovaz94/mail-pipeline-general
              imagePullPolicy: IfNotPresent
              ports:
              - containerPort: 80
              resources:
                requests:
                  cpu: 10m
                  memory: 10M
              env:
              - name: MCL
                value: '110'
              - name: REDIS_HOST
                value: redis-service
              - name: SERVICE_NAME
                value: parser
              - name: PORT
                value: '80'
              - name: MAX_SIZE
                value: '800'
              - name: MAX_CONNECTIONS
                value: '70'
              - name: PIPELINE_COUNT
                value: '1'
              - name: PORT_VIRUS_SCANNER_SERVICE
                type: virus-scanner-service-type
              - name: PORT_HEADER_ANALYZER_SERVICE
                type: header-analyzer-service-type
              - name: PORT_TEXT_ANALYZER_SERVICE
                type: text-analyzer-service-type
