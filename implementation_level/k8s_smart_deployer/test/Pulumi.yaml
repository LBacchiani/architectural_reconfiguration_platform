        labels:
          type: parser-type
      spec:
        replicas: 2
        selector:
          matchLabels:
            type: parser-type
        template:
          metadata:
            labels:
              type: parser-type
          spec:
            containers:
            - name: parser
              image: giovaz94/mail-pipeline-general
              imagePullPolicy: IfNotPresent
              ports:
              - containerPort: 80
              resources:
                requests:
                  cpu: 10m
                  memory: 10M
              env:
              - name: MCL
                value: '110'
              - name: REDIS_HOST
                value: redis-service
              - name: SERVICE_NAME
                value: parser
              - name: PORT
                value: '80'
              - name: MAX_SIZE
                value: '800'
              - name: MAX_CONNECTIONS
                value: '70'
              - name: PIPELINE_COUNT
                value: '1'
              - name: PORT_VIRUS_SCANNER_SERVICE
                type: virus-scanner-service-type
              - name: PORT_HEADER_ANALYZER_SERVICE
