name: my-k8s-app
runtime: yaml
resources:
  message-analyzer-98876817-b7f6-4370-8327-c4d5a8f73770:
    name: message-analyzer-98876817-b7f6-4370-8327-c4d5a8f73770
    type: kubernetes:apps/v1:Deployment
    properties:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: message-analyzer-98876817-b7f6-4370-8327-c4d5a8f73770
        labels:
          type: message-analyzer-type
      spec:
        replicas: 2
        selector:
          matchLabels:
            type: message-analyzer-type
        template:
          metadata:
            labels:
              type: message-analyzer-type
          spec:
            containers:
            - name: message-analyzer
              image: giovaz94/mail-pipeline-general
              imagePullPolicy: IfNotPresent
              ports:
              - containerPort: 80
              resources:
                requests:
                  cpu: 10m
                  memory: 10M
              env:
              - name: MCL
                value: '300'
              - name: REDIS_HOST
                value: redis-service
              - name: SERVICE_NAME
                value: message-analyzer
              - name: PORT
                value: '80'
              - name: MAX_SIZE
                value: '800'
              - name: MAX_CONNECTIONS
                value: '70'
              - name: PIPELINE_COUNT
                value: '1'
    options: {}
  virus-scanner-2d7ac5cf-961d-4f08-a655-84fcc74da527:
    name: virus-scanner-2d7ac5cf-961d-4f08-a655-84fcc74da527
    type: kubernetes:apps/v1:Deployment
    properties:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: virus-scanner-2d7ac5cf-961d-4f08-a655-84fcc74da527
        labels:
          type: virus-scanner-type
      spec:
        replicas: 2
        selector:
          matchLabels:
            type: virus-scanner-type
        template:
          metadata:
            labels:
              type: virus-scanner-type
          spec:
            containers:
            - name: virus-scanner
              image: giovaz94/mail-pipeline-general
              imagePullPolicy: IfNotPresent
              ports:
              - containerPort: 80
              resources:
                requests:
                  cpu: 10m
                  memory: 10M
              env:
              - name: MCL
                value: '120'
              - name: REDIS_HOST
                value: redis-service
              - name: SERVICE_NAME
                value: virus-scanner
              - name: PORT
                value: '80'
              - name: MAX_SIZE
                value: '800'
              - name: MAX_CONNECTIONS
                value: '70'
              - name: PIPELINE_COUNT
                value: '1'
              - name: PORT_MESSAGE_ANALYZER_SERVICE
                type: message-analyzer-service-type
              - name: PORT_ATTACHMENT_MANAGER_SERVICE
                type: attachment-manager-service-type
