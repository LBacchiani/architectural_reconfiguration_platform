apiVersion: v1
kind: Pod
type: birex-collector-type
spec:
  containers:
    - image: lukesmolo/public:birex-collector_0.0.5
      name: birex-collector
      resources:
        requests:
          cpu: "10m"
          memory: "10M"
ports:
  strong:
    - type: "birex-collector-service-type"
      config:
        envName: PORT_BIREX_COLLECTOR_SERVICE
        containers:
          - name: birex-collector
